name: CI

on:
  pull_request:
    branches: [main, v0.4]

# 같은 브랜치의 이전 run을 자동 취소 — hang/중복 run 누적 방지
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm -r run build
      - run: pnpm -r run test
      - run: pnpm --filter react-naver-maps run check:package

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter react-naver-maps exec playwright install --with-deps chromium
      - run: pnpm --filter react-naver-maps run test:scenarios
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: scenarios-test-results
          path: packages/react-naver-maps/test-results

  frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter react-naver-maps run build
      - run: pnpm --filter react-naver-maps exec playwright install --with-deps chromium
      - run: pnpm --filter react-naver-maps run verify:frameworks
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frameworks-report
          path: packages/react-naver-maps/test-results/frameworks.json
